; vigilo PHP settings, baked into the image (app, queue and scheduler).

; No version banner, errors to the log — never into a page.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 2M
post_max_size = 8M
date.timezone = UTC

; Code is baked into the image, so timestamps never need re-checking.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

session.use_strict_mode = 1
session.cookie_httponly = 1
