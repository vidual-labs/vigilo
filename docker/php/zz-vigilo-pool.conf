; PHP-FPM pool tuned for a small VPS: workers start on demand and exit
; when idle, so an idle install costs almost nothing.
[www]
listen = 9000
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 20s
pm.max_requests = 500

; Pass the container environment (compose env_file) through to PHP.
clear_env = no

; Docker healthcheck endpoint (cgi-fcgi, not reachable through Caddy).
ping.path = /ping
ping.response = pong

; Caddy logs requests; workers log to stderr.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
